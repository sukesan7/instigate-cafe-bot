[project]
name = "campus-bot"
version = "1.0.0rc1"
description = "Instigate Cafe Bot — Campus utility, transit alerts, job alerts, and community simulation Discord bot"
readme = "README.md"
license = { text = "MIT" }
# Runtime uses Python 3.11+ stdlib features (datetime.UTC); tested CI matrix is 3.11–3.13
# (recommended managed Python 3.12). Python 3.14+ is excluded (<3.14) for native wheel compatibility.
requires-python = ">=3.11,<3.14"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "discord.py>=2.3.2,<3.0.0",
    "audioop-lts>=0.2.2; python_version >= '3.13'",
    "python-dotenv>=1.0.1",
    "aiosqlite>=0.20.0",
    "tzdata>=2024.1",
    "aiohttp>=3.9.0,<4.0.0",
    "certifi>=2024.0.0",
    "beautifulsoup4>=4.12.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "aioresponses>=0.7.6",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "pip-audit>=2.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "aioresponses>=0.7.6",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "pip-audit>=2.7.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = ["."]
testpaths = ["tests"]
norecursedirs = [
    "scripts",
    ".git",
    ".venv",
    "venv",
    "docs",
    "assets",
    "tools",
    "__pycache__",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers -m 'not live_smoke'"
filterwarnings = [
    "ignore:'audioop' is deprecated and slated for removal in Python 3.13:DeprecationWarning",
]
markers = [
    "unit: Pure unit tests with no database, Discord, or outbound network dependencies.",
    "storage: Storage integration tests using temporary isolated SQLite databases.",
    "discord_mock: Mocked Discord integration tests using fake Interaction/Member/Client objects.",
    "provider_contract: External API contract tests using monkeypatched HTTP and sanitized local fixtures.",
    "live_smoke: Opt-in manual live smoke diagnostics (excluded by default; never executed automatically).",
]

[tool.coverage.run]
source = ["icbot"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".venv", "assets", "docs"]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
    "B",
    "BLE",
    "DTZ",
    "S110",
    "S112",
    "G",
    "PIE",
    "SIM",
    "RUF",
    "EXE",
]
ignore = [
    # Intentional Unicode typography in Discord embeds and card/suit UI (en-dashes, spades).
    "RUF001",
    # Symmetric expression/set invariants in unit tests are clearer in left-to-right domain order.
    "SIM300",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
exclude = ["^\\.venv/", "^scripts/", "^tests/"]

