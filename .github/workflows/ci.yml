name: Quality & Security Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Explicit offline safety defaults: no Discord token, no provider keys, no pollers, no deployment.
env:
  DISCORD_TOKEN: ""
  GEMINI_API_KEY: ""
  GO_API_KEY: ""
  ODDS_API_KEY: ""
  ALPHAVANTAGE_API_KEY: ""
  TTC_MASTODON_ACCT: ""
  LLM_ENABLED: "false"
  MARKET_WATCH_ENABLED: "false"
  MARKET_DAILY_REPORT_ENABLED: "false"
  BTC_WATCH_ENABLED: "false"
  JOBS_POLL_SECONDS: "0"
  WORKDAY_POLL_SECONDS: "0"
  JOBS_BOOTSTRAP_POST: "false"
  TTC_BOOTSTRAP_POST_LATEST: "false"
  ICBOT_ALLOW_GATEWAY: "false"

jobs:
  quality:
    name: Offline Matrix Checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v5.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ matrix.python-version }}

      - name: Verify lockfile consistency
        run: uv lock --check

      - name: Install locked development environment
        run: uv sync --frozen --dev

      - name: Run deterministic secret and publish-safety scan
        run: uv run python tools/scan_secrets.py --enforce-clean

      - name: Validate and run offline pre-commit hooks
        run: |
          uv run pre-commit validate-config .pre-commit-config.yaml
          uv run pre-commit run --all-files

      - name: Check Ruff lint and formatting
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run mypy type check
        run: uv run mypy .

      - name: Run offline AST and zero-token import smoke check
        run: uv run python tools/smoke_offline.py

      - name: Run offline syntax check (Python, JSON, TOML, YAML)
        run: uv run python tools/check_syntax.py pyproject.toml .pre-commit-config.yaml .github/workflows/ci.yml .github/dependabot.yml tools/lore.example.json

      - name: Run offline staging lifecycle and SQLite migration smoke check
        run: uv run python tools/smoke_staging.py

      - name: Validate documentation links, images, and command-tree parity
        run: |
          uv run python tools/check_docs.py
          uv run python tools/check_command_docs.py

      - name: Verify offline pytest collection (zero network side effects)
        run: uv run pytest --collect-only -q

      - name: Run offline pytest suite with branch coverage
        run: uv run pytest --cov=icbot --cov-report=term-missing --cov-report=xml:coverage.xml -v

      - name: Upload safe coverage report artifact
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4.4.3
        with:
          name: coverage-report-py312
          path: coverage.xml
          retention-days: 14
          if-no-files-found: ignore

  dependency-audit:
    name: Dependency Vulnerability Audit (Networked PyPI/OSV)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@v5.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.12"

      - name: Verify lockfile consistency
        run: uv lock --check

      - name: Install locked development environment
        run: uv sync --frozen --dev

      - name: Run dependency vulnerability audit (queries PyPI/OSV)
        run: uv run pip-audit --desc auto
